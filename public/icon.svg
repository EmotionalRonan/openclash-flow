<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#grad)" filter="url(#shadow)" />
  
  <!-- Topology Network Nodes & Lines -->
  <g fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center Router Node -->
    <circle cx="256" cy="256" r="44" fill="#ffffff" stroke="#ffffff" stroke-width="12" />
    
    <!-- Outer Connected Nodes -->
    <circle cx="128" cy="148" r="30" fill="url(#grad)" stroke="#ffffff" stroke-width="16" />
    <circle cx="384" cy="148" r="30" fill="url(#grad)" stroke="#ffffff" stroke-width="16" />
    <circle cx="128" cy="364" r="30" fill="url(#grad)" stroke="#ffffff" stroke-width="16" />
    <circle cx="384" cy="364" r="30" fill="url(#grad)" stroke="#ffffff" stroke-width="16" />
    
    <!-- Connection Lines -->
    <path d="M 152 168 L 226 232" opacity="0.85" />
    <path d="M 360 168 L 286 232" opacity="0.85" />
    <path d="M 152 344 L 226 280" opacity="0.85" />
    <path d="M 360 344 L 286 280" opacity="0.85" />
    
    <!-- Center Accent Dot -->
    <circle cx="256" cy="256" r="16" fill="#4f46e5" stroke="none" />
  </g>
</svg>
