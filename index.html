<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenClash Flow - ImmortalWRT 智能可视化管理面板</title>
    <meta name="description" content="专为 ImmortalWRT OpenClash 打造的可视化分流管理面板，支持拖拽式策略配置、一键节点导入、实时日志监控与自动配置生成。" />
    <meta property="og:title" content="OpenClash Flow - ImmortalWRT 智能可视化管理面板" />
    <meta property="og:description" content="专为 ImmortalWRT OpenClash 打造的可视化分流管理面板，支持拖拽式策略配置、一键节点导入、实时日志监控与自动配置生成。" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased font-sans selection:bg-indigo-500/30 selection:text-indigo-200">
    <div id="root">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;font-family:system-ui,-apple-system,sans-serif;color:#94a3b8;background:#020617;text-align:center;">
        <div style="width:44px;height:44px;border:3px solid #1e293b;border-top-color:#6366f1;border-radius:50%;animation:oc_spin 0.9s linear infinite;margin-bottom:18px;"></div>
        <div style="font-size:18px;font-weight:700;color:#f8fafc;margin-bottom:6px;letter-spacing:-0.02em;">OpenClash Flow</div>
        <div style="font-size:13px;color:#64748b;max-width:320px;line-height:1.5;">正在加载智能分流拓扑画布与规则引擎...</div>
        <style>@keyframes oc_spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && (!root.children.length || root.innerHTML.indexOf('oc_spin') !== -1)) {
          root.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;padding:32px;font-family:system-ui,sans-serif;color:#e2e8f0;background:#020617;text-align:center;">' +
            '<div style="font-size:32px;margin-bottom:12px;">⚠️</div>' +
            '<div style="font-size:18px;font-weight:700;color:#f87171;margin-bottom:8px;">静态资源加载遇到问题</div>' +
            '<div style="font-size:13px;color:#94a3b8;max-width:460px;margin-bottom:20px;line-height:1.6;">' +
              (e.message || '脚本加载异常，请尝试点击下方按钮在新标签页中直接访问，或刷新 LuCI 缓存。') +
            '</div>' +
            '<div style="display:flex;gap:10px;">' +
              '<button onclick="window.location.reload(true)" style="padding:8px 16px;background:#334155;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;">强制刷新</button>' +
              '<a href="' + window.location.href + '" target="_blank" style="padding:8px 16px;background:#4f46e5;color:#fff;text-decoration:none;border-radius:6px;font-size:13px;">独立全屏打开</a>' +
            '</div>' +
          '</div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
